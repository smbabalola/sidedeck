[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sidedeck"
version = "0.1.0"
description = "Deterministic, proposal-only AI trading research foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.17.1",
  "pydantic==2.11.7",
  "SQLAlchemy==2.0.44",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "hypothesis==6.140.3", "ruff==0.13.1", "mypy==1.18.2", "psycopg[binary]==3.2.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party", "parked-uk-bp"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
