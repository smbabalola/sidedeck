name: SideDeck CI

on:
  push:
    branches: [main, feat/p1-foundation]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sidedeck
          POSTGRES_PASSWORD: sidedeck
          POSTGRES_DB: sidedeck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidedeck -d sidedeck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      SIDEDECK_TEST_POSTGRES_URL: postgresql+psycopg://sidedeck:sidedeck@localhost:5432/sidedeck_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: python -m pytest
      - run: ruff check .
      - run: mypy src --no-incremental --follow-imports=silent
